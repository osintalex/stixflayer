[package]
name = "antlr-poc"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
harness = { path = "../harness" }
antlr-rust-runtime = "0.34.0"
# rustpython-vm 0.5.0 (a hard dep of antlr-rust-codegen) does not compile
# against libc >= 0.2.186, where POSIX_SPAWN_SETSID became c_short.
libc = "=0.2.185"

[build-dependencies]
antlr-rust-codegen = "0.34.0"
