name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only: CI never publishes or pushes.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # -------------------------------------------------------------------------
  # Stage 1 — quality gate. Six independent parallel jobs; the test stage
  # below waits for every one of them.
  # -------------------------------------------------------------------------
  rust-fmt:
    name: Rust / format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # stable (rustfmt + clippy included)
        with:
          toolchain: stable
      - run: cargo fmt --all -- --check

  rust-clippy:
    name: Rust / lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.1
      - run: cargo clippy --workspace --all-targets -- -D warnings

  rust-build:
    name: Rust / compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.1
      - run: cargo build --workspace

  py-format:
    name: Python / format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.7.0
        with:
          python-version: "3.13"
          enable-cache: true
      # Dev tools only — skip building the extension (no Rust toolchain here).
      - run: uv sync --no-install-project
      - run: uv run --no-sync ruff format --check .

  py-lint:
    name: Python / lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.7.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --no-install-project
      - run: uv run --no-sync ruff check .

  py-typecheck:
    name: Python / types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.7.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --no-install-project
      - run: uv run --no-sync pyrefly check

  # -------------------------------------------------------------------------
  # Stage 2 — tests. Runs only after every gate job above has passed.
  # -------------------------------------------------------------------------
  rust-test:
    name: Rust / tests (${{ matrix.os }})
    needs: [rust-fmt, rust-clippy, rust-build, py-format, py-lint, py-typecheck]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.1
      - run: cargo test --workspace

  rust-cross:
    name: Rust / cross-compile (${{ matrix.target }})
    needs: [rust-fmt, rust-clippy, rust-build, py-format, py-lint, py-typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-unknown-linux-gnu, x86_64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cross
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.1
      - run: cross build --workspace --target ${{ matrix.target }}

  py-test:
    name: Python / tests (${{ matrix.os }})
    needs: [rust-fmt, rust-clippy, rust-build, py-format, py-lint, py-typecheck]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      # Rust toolchain is required: the maturin build backend compiles the extension.
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.7.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync
      - run: uv run pytest --benchmark-disable
