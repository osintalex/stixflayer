name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Baseline is read-only; the two publish jobs elevate explicitly.
permissions:
  contents: read

# Serialize releases: a new push to main waits for an in-progress release
# instead of canceling it, so every run's gate sees the previous run's tags.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # -------------------------------------------------------------------------
  # Gate: release only what was version-bumped. Compares each manifest
  # version against the latest py-v* / rust-v* tag.
  # -------------------------------------------------------------------------
  gate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      py_release: ${{ steps.gate.outputs.py_release }}
      py_version: ${{ steps.gate.outputs.py_version }}
      rust_release: ${{ steps.gate.outputs.rust_release }}
      rust_version: ${{ steps.gate.outputs.rust_version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0 # full history so every release tag is visible
      - id: gate
        run: |
          python3 .github/scripts/check_release_gate.py \
            --manifest pyproject.toml --tag-prefix py-v --output-prefix py_ >> "$GITHUB_OUTPUT"
          python3 .github/scripts/check_release_gate.py \
            --manifest rust/Cargo.toml --tag-prefix rust-v --output-prefix rust_ >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------------
  # Python release: build one abi3 wheel per platform → smoke check →
  # publish all wheels to PyPI in one release → tag py-v<version>.
  # -------------------------------------------------------------------------
  python-build:
    name: Python / build wheel (${{ matrix.name }})
    needs: [gate]
    if: needs.gate.outputs.py_release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: manylinux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { name: manylinux-aarch64, os: ubuntu-24.04-arm, target: aarch64, manylinux: auto }
          - { name: musllinux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { name: musllinux-aarch64, os: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
          - { name: macos-arm64, os: macos-latest, target: aarch64, manylinux: '' }
          - { name: windows-x86_64, os: windows-latest, target: x86_64, manylinux: '' }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          rust-toolchain: stable
          args: --release --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist

  python-smoke:
    name: Python / smoke check (${{ matrix.name }})
    needs: [gate, python-build]
    if: needs.gate.outputs.py_release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: manylinux-x86_64, os: ubuntu-latest, docker: false }
          - { name: manylinux-aarch64, os: ubuntu-24.04-arm, docker: false }
          # musllinux wheels only run on a musl system: use an Alpine container.
          - { name: musllinux-x86_64, os: ubuntu-latest, docker: true }
          - { name: musllinux-aarch64, os: ubuntu-24.04-arm, docker: true }
          - { name: macos-arm64, os: macos-latest, docker: false }
          - { name: windows-x86_64, os: windows-latest, docker: false }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist
      # Plain venv + pip — no uv, keeping the release path dependency-free.
      - if: ${{ !matrix.docker }}
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" -m venv .venv
          if [ -x .venv/bin/python ]; then VPY=.venv/bin/python; else VPY=.venv/scripts/python.exe; fi
          "$VPY" -m pip install --quiet dist/*.whl
          "$VPY" .github/scripts/smoke_test.py
      - if: ${{ matrix.docker }}
        shell: bash
        run: |
          docker run --rm -v "$PWD:/work" -w /work alpine:3.20 sh -c '
            apk add --no-cache python3 py3-pip >/dev/null &&
            pip install --break-system-packages --quiet dist/*.whl &&
            python .github/scripts/smoke_test.py
          '

  python-publish:
    name: Python / publish to PyPI
    needs: [gate, python-smoke]
    if: needs.gate.outputs.py_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: write # push the py-v* release tag
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Check wheel inventory
        run: |
          count="$(ls dist/*.whl | wc -l)"
          ls -1 dist
          [ "$count" -eq 6 ] || { echo "expected exactly 6 wheels, got $count" >&2; exit 1; }
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
      - name: Tag the release
        run: |
          git tag "py-v${{ needs.gate.outputs.py_version }}"
          git push origin "py-v${{ needs.gate.outputs.py_version }}"

  # -------------------------------------------------------------------------
  # Rust release: verify on all platforms → publish crates.io → tag.
  # -------------------------------------------------------------------------
  rust-test:
    name: Rust / tests (${{ matrix.os }})
    needs: [gate]
    if: needs.gate.outputs.rust_release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: rust
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - run: cargo test --workspace

  rust-cross:
    name: Rust / cross-compile (${{ matrix.target }})
    needs: [gate]
    if: needs.gate.outputs.rust_release == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native build on a free ARM runner: the host target IS aarch64-linux-gnu.
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            native: true
          # Cross-compiled with rustc's bundled lld (self-contained linking);
          # a pure-Rust crate needs no musl toolchain and no container.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            native: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - if: matrix.native
        working-directory: rust
        run: cargo build --workspace
      - if: ${{ !matrix.native }}
        working-directory: rust
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --workspace --target ${{ matrix.target }}

  rust-publish:
    name: Rust / publish to crates.io
    needs: [gate, rust-test, rust-cross]
    if: needs.gate.outputs.rust_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push the rust-v* release tag
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - name: Check whether stixflayer_derive is already on crates.io
        id: derive
        working-directory: rust
        run: |
          version="$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "stixflayer_derive") | .version')"
          status="$(curl -s -o /dev/null -w '%{http_code}' -A 'stixflayer-release-ci' "https://crates.io/api/v1/crates/stixflayer_derive/${version}")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ "$status" = "200" ]; then echo "published=true" >> "$GITHUB_OUTPUT"; else echo "published=false" >> "$GITHUB_OUTPUT"; fi
          echo "stixflayer_derive ${version}: crates.io status ${status}"
      - name: Publish stixflayer_derive
        if: steps.derive.outputs.published == 'false'
        working-directory: rust
        run: cargo publish -p stixflayer_derive
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Wait for crates.io to index stixflayer_derive
        working-directory: rust
        run: |
          version="${{ steps.derive.outputs.version }}"
          for _ in $(seq 1 30); do
            status="$(curl -s -o /dev/null -w '%{http_code}' -A 'stixflayer-release-ci' "https://crates.io/api/v1/crates/stixflayer_derive/${version}")"
            [ "$status" = "200" ] && exit 0
            sleep 3
          done
          echo "crates.io did not index stixflayer_derive ${version} within 90s" >&2
          exit 1
      - name: Check whether stixflayer is already on crates.io
        id: main
        working-directory: rust
        run: |
          version="$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "stixflayer") | .version')"
          status="$(curl -s -o /dev/null -w '%{http_code}' -A 'stixflayer-release-ci' "https://crates.io/api/v1/crates/stixflayer/${version}")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ "$status" = "200" ]; then echo "published=true" >> "$GITHUB_OUTPUT"; else echo "published=false" >> "$GITHUB_OUTPUT"; fi
          echo "stixflayer ${version}: crates.io status ${status}"
      - name: Publish stixflayer
        if: steps.main.outputs.published == 'false'
        working-directory: rust
        run: cargo publish -p stixflayer
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Tag the release
        run: |
          git tag "rust-v${{ needs.gate.outputs.rust_version }}"
          git push origin "rust-v${{ needs.gate.outputs.rust_version }}"
