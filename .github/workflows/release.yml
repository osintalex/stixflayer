name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Baseline is read-only; the publish jobs elevate explicitly.
permissions:
  contents: read

# Serialize releases: a new push to main waits for an in-progress release
# instead of canceling it, so every run's gate sees the previous run's tags.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # -------------------------------------------------------------------------
  # Gate: release only what was version-bumped. Compares each manifest
  # version against the latest py-v* / rust-v* tag.
  # -------------------------------------------------------------------------
  gate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      py_release: ${{ steps.gate.outputs.py_release }}
      py_version: ${{ steps.gate.outputs.py_version }}
      rust_release: ${{ steps.gate.outputs.rust_release }}
      rust_version: ${{ steps.gate.outputs.rust_version }}
      cli_release: ${{ steps.gate.outputs.cli_release }}
      cli_version: ${{ steps.gate.outputs.cli_version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0 # full history so every release tag is visible
      - id: gate
        run: |
          python3 .github/scripts/check_release_gate.py \
            --manifest pyproject.toml --tag-prefix py-v --output-prefix py_ >> "$GITHUB_OUTPUT"
          python3 .github/scripts/check_release_gate.py \
            --manifest rust/Cargo.toml --tag-prefix rust-v --output-prefix rust_ >> "$GITHUB_OUTPUT"
          python3 .github/scripts/check_release_gate.py \
            --manifest rust/stixflayer-cli/Cargo.toml --tag-prefix cli-v --output-prefix cli_ >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------------
  # Python release: build one abi3 wheel per platform → smoke check →
  # publish all wheels to PyPI in one release → tag py-v<version>.
  # -------------------------------------------------------------------------
  python-build:
    name: Python / build wheel (${{ matrix.name }})
    needs: [gate]
    if: needs.gate.outputs.py_release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: manylinux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { name: manylinux-aarch64, os: ubuntu-24.04-arm, target: aarch64, manylinux: auto }
          - { name: musllinux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { name: musllinux-aarch64, os: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
          - { name: macos-arm64, os: macos-latest, target: aarch64, manylinux: '' }
          - { name: windows-x86_64, os: windows-latest, target: x86_64, manylinux: '' }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          rust-toolchain: stable
          args: --release --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist

  python-smoke:
    name: Python / smoke check (${{ matrix.name }})
    needs: [gate, python-build]
    if: needs.gate.outputs.py_release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: manylinux-x86_64, os: ubuntu-latest, docker: false }
          - { name: manylinux-aarch64, os: ubuntu-24.04-arm, docker: false }
          # musllinux wheels only run on a musl system: use an Alpine container.
          - { name: musllinux-x86_64, os: ubuntu-latest, docker: true }
          - { name: musllinux-aarch64, os: ubuntu-24.04-arm, docker: true }
          - { name: macos-arm64, os: macos-latest, docker: false }
          - { name: windows-x86_64, os: windows-latest, docker: false }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist
      # Plain venv + pip — no uv, keeping the release path dependency-free.
      - if: ${{ !matrix.docker }}
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" -m venv .venv
          if [ -x .venv/bin/python ]; then VPY=.venv/bin/python; else VPY=.venv/scripts/python.exe; fi
          "$VPY" -m pip install --quiet dist/*.whl
          "$VPY" .github/scripts/smoke_test.py
      - if: ${{ matrix.docker }}
        shell: bash
        run: |
          docker run --rm -v "$PWD:/work" -w /work alpine:3.20 sh -c '
            apk add --no-cache python3 py3-pip >/dev/null &&
            pip install --break-system-packages --quiet dist/*.whl &&
            python .github/scripts/smoke_test.py
          '

  python-publish:
    name: Python / publish to PyPI
    needs: [gate, python-smoke]
    if: needs.gate.outputs.py_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: write # push the py-v* release tag
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Check wheel inventory
        run: |
          count="$(ls dist/*.whl | wc -l)"
          ls -1 dist
          [ "$count" -eq 6 ] || { echo "expected exactly 6 wheels, got $count" >&2; exit 1; }
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
      - name: Tag the release
        run: |
          git tag "py-v${{ needs.gate.outputs.py_version }}"
          git push origin "py-v${{ needs.gate.outputs.py_version }}"

  # -------------------------------------------------------------------------
  # Docs release: publish versioned docs for the Python release that just
  # shipped. Runs only when a Python release happened AND its publish
  # succeeded — a skipped or failed publish skips this job entirely.
  # Shares the docs-deploy concurrency group with dev deploys (docs.yml),
  # so the two never race on the gh-pages branch.
  # -------------------------------------------------------------------------
  docs-deploy:
    name: Docs / deploy versioned docs
    needs: [gate, python-publish]
    if: needs.gate.outputs.py_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push versioned docs to the gh-pages branch
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    steps:
      # Full history so mike can manage the gh-pages branch.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0
      # Docs tooling only — the site build needs no compiled extension.
      - name: Install docs tooling
        run: |
          python3 -m venv .venv-docs
          .venv-docs/bin/pip install --quiet -r docs/requirements.txt
      - name: Configure git for mike commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Deploy versioned docs
        # Versions track Python releases at minor granularity (0.1.0 -> 0.1)
        # with `latest` as alias; the site root always serves latest.
        # Aliases must be real copies: GitHub Pages does not follow symlink
        # blobs, so mike's default symlinked `latest` would 404 (and copy
        # keeps latest/llms.txt a real file). The site is small enough that
        # duplicating it per release is cheap.
        run: |
          export PATH="$PWD/.venv-docs/bin:$PATH"
          py_version="${{ needs.gate.outputs.py_version }}"
          case "$py_version" in
            *.*.*) minor="${py_version%.*}" ;;
            *) minor="$py_version" ;;
          esac
          echo "Deploying docs for Python release $py_version as version $minor"
          mike deploy --alias-type=copy "$minor" latest --push
          mike set-default latest --push

  # -------------------------------------------------------------------------
  # Rust release: verify on all platforms → publish crates.io → tag.
  # -------------------------------------------------------------------------
  rust-test:
    name: Rust / tests (${{ matrix.os }})
    needs: [gate]
    if: needs.gate.outputs.rust_release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: rust
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - run: cargo test --workspace

  rust-cross:
    name: Rust / cross-compile (${{ matrix.target }})
    needs: [gate]
    if: needs.gate.outputs.rust_release == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native build on a free ARM runner: the host target IS aarch64-linux-gnu.
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            native: true
          # Cross-compiled with rustc's bundled lld (self-contained linking);
          # a pure-Rust crate needs no musl toolchain and no container.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            native: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - if: matrix.native
        working-directory: rust
        run: cargo build --workspace
      - if: ${{ !matrix.native }}
        working-directory: rust
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --workspace --target ${{ matrix.target }}

  rust-publish:
    name: Rust / publish to crates.io
    needs: [gate, rust-test, rust-cross]
    if: needs.gate.outputs.rust_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The CLI job may also need to publish stixflayer/stixflayer_derive on a
    # first release; serialize the two crates.io publishers.
    concurrency:
      group: crates-io-publish
      cancel-in-progress: false
    permissions:
      contents: write # push the rust-v* release tag
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      # The derive shares the workspace version, so a release always introduces a
      # version that has never been published. Its presence on crates.io can
      # therefore only mean an earlier attempt of this same release published it
      # (e.g. the library publish failed and the run was retried): treat that as
      # a retry and continue rather than skipping or failing.
      - name: Publish stixflayer_derive
        id: derive
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "stixflayer_derive") | .version')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          log="$(mktemp)"
          if cargo publish -p stixflayer_derive > "$log" 2>&1; then
            cat "$log"
            echo "published stixflayer_derive ${version}"
          else
            cat "$log" >&2
            status="$(curl -s -o /dev/null -w '%{http_code}' -A 'stixflayer-release-ci' "https://crates.io/api/v1/crates/stixflayer_derive/${version}")"
            if grep -Eqi 'already (uploaded|exists)' "$log" || [ "$status" = "200" ]; then
              echo "stixflayer_derive ${version} was published by an earlier attempt of this release; continuing"
            else
              exit 1
            fi
          fi
      - name: Wait for crates.io to index stixflayer_derive
        working-directory: rust
        run: |
          version="${{ steps.derive.outputs.version }}"
          for _ in $(seq 1 30); do
            status="$(curl -s -o /dev/null -w '%{http_code}' -A 'stixflayer-release-ci' "https://crates.io/api/v1/crates/stixflayer_derive/${version}")"
            [ "$status" = "200" ] && exit 0
            sleep 3
          done
          echo "crates.io did not index stixflayer_derive ${version} within 90s" >&2
          exit 1
      - name: Check whether stixflayer is already on crates.io
        id: main
        working-directory: rust
        run: |
          version="$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "stixflayer") | .version')"
          status="$(curl -s -o /dev/null -w '%{http_code}' -A 'stixflayer-release-ci' "https://crates.io/api/v1/crates/stixflayer/${version}")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ "$status" = "200" ]; then echo "published=true" >> "$GITHUB_OUTPUT"; else echo "published=false" >> "$GITHUB_OUTPUT"; fi
          echo "stixflayer ${version}: crates.io status ${status}"
      - name: Publish stixflayer
        if: steps.main.outputs.published == 'false'
        working-directory: rust
        run: cargo publish -p stixflayer
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Tag the release
        run: |
          git tag "rust-v${{ needs.gate.outputs.rust_version }}"
          git push origin "rust-v${{ needs.gate.outputs.rust_version }}"

  # -------------------------------------------------------------------------
  # CLI release: build four archives and wheels → publish to PyPI and
  # crates.io → attach assets to a cli-v<version> GitHub release.
  # -------------------------------------------------------------------------
  cli-build:
    name: CLI / build (${{ matrix.target }})
    needs: [gate]
    if: needs.gate.outputs.cli_release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # Apply crt-static only to the musl target artifacts, not to host
      # proc-macro builds (which cannot be static).
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: "-C target-feature=+crt-static"
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: "-C target-feature=+crt-static"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Build binary
        working-directory: rust
        run: cargo build --release -p stixflayer-cli --target ${{ matrix.target }}
      - name: Verify the Linux binary is statically linked
        if: contains(matrix.target, 'linux')
        run: |
          binary="rust/target/${{ matrix.target }}/release/stixflayer"
          file "$binary"
          headers="$(readelf -lW "$binary")"
          if printf '%s\n' "$headers" | grep -q 'INTERP'; then
            echo "expected a self-contained binary, but it has a PT_INTERP program header" >&2
            exit 1
          fi
          dynamic="$(readelf -dW "$binary" 2>/dev/null || true)"
          if printf '%s\n' "$dynamic" | grep -q '(NEEDED)'; then
            echo "expected a self-contained binary, but it has DT_NEEDED entries" >&2
            exit 1
          fi
          echo "no ELF interpreter and no shared-library dependencies"
      - name: Package archive
        run: |
          version="${{ needs.gate.outputs.cli_version }}"
          target="${{ matrix.target }}"
          mkdir -p dist
          cp "rust/target/${target}/release/stixflayer" dist/stixflayer
          tar -czf "dist/stixflayer-${version}-${target}.tar.gz" -C dist stixflayer
      - name: Build wheel
        working-directory: rust/stixflayer-cli
        run: |
          python3 -m venv .maturin
          if [ "${{ runner.os }}" = "Linux" ]; then
            .maturin/bin/pip install --quiet maturin patchelf
          else
            .maturin/bin/pip install --quiet maturin
          fi
          .maturin/bin/maturin build --release --target "${{ matrix.target }}" --out ../../dist/wheels
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-${{ matrix.target }}
          path: dist

  cli-publish:
    name: CLI / publish
    needs: [gate, cli-build, rust-publish]
    if: ${{ always() && needs.gate.outputs.cli_release == 'true' && needs.cli-build.result == 'success' && (needs.rust-publish.result == 'success' || needs.rust-publish.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pypi
    concurrency:
      group: crates-io-publish
      cancel-in-progress: false
    permissions:
      contents: write # create the cli-v* release and tag
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - name: Check archive and wheel inventory
        run: |
          archives="$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)"
          wheels="$(find dist/wheels -maxdepth 1 -name '*.whl' | wc -l)"
          find dist -maxdepth 2 -type f | sort
          [ "$archives" -eq 4 ] || { echo "expected 4 archives, got $archives" >&2; exit 1; }
          [ "$wheels" -eq 4 ] || { echo "expected 4 wheels, got $wheels" >&2; exit 1; }
      - name: Generate checksums and stage the installer
        run: |
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS
          cp ../install.sh install.sh
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/wheels
      - name: Publish the CLI and its library dependencies to crates.io
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -e
          # Publish derive → library → CLI, each only when that exact version is
          # absent from crates.io. Versions are resolved from the workspace, so a
          # present version can only be an earlier attempt of this same release
          # (for example, rust-publish already published the derive): continue
          # instead of failing. Every publish waits for crates.io indexing so the
          # next crate can depend on the one just uploaded.
          publish_if_missing() {
            package="$1"
            version="$(cargo metadata --format-version 1 --no-deps | jq -r --arg p "$package" '.packages[] | select(.name == $p) | .version')"
            status="$(curl -s -o /dev/null -w '%{http_code}' -A 'stixflayer-release-ci' "https://crates.io/api/v1/crates/${package}/${version}")"
            if [ "$status" = "200" ]; then
              echo "${package} ${version} is already published by an earlier attempt of this release; continuing"
              return 0
            fi
            cargo publish -p "$package"
            for _ in $(seq 1 30); do
              status="$(curl -s -o /dev/null -w '%{http_code}' -A 'stixflayer-release-ci' "https://crates.io/api/v1/crates/${package}/${version}")"
              [ "$status" = "200" ] && return 0
              sleep 3
            done
            echo "crates.io did not index ${package} ${version} within 90s" >&2
            exit 1
          }
          publish_if_missing stixflayer_derive
          publish_if_missing stixflayer
          publish_if_missing stixflayer-cli
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.gate.outputs.cli_version }}"
          tag="cli-v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.tar.gz dist/SHA256SUMS dist/install.sh --clobber
          else
            gh release create "$tag" dist/*.tar.gz dist/SHA256SUMS dist/install.sh \
              --title "stixflayer CLI v${version}" \
              --notes "Static Linux (musl) and macOS builds of the stixflayer CLI." \
              --target "$GITHUB_SHA"
          fi
