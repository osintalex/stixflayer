[package]
name = "stixflayer"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"

[workspace]
members = [".", "stixflayer_derive"]

[lib]
name = "stixflayer"

[features]
default = ["pyo3"]
pyo3 = ["dep:pyo3", "pyo3/abi3-py311"]

[dependencies]
addr = "0.15.6"
base64 = "0.22.1"
convert_case = "0.7.1"
stixflayer_derive = { path = "stixflayer_derive", version = "0.1.0" }
email_address = "0.2"
hex = "0.4.3"
identyhash = "0.1.0"
iptools = "0.3.0"
jiff = { version = "0.1.13", features = ["serde"] }
json-canon = "0.1.3"
language-tags = "0.3.2"
log = "0.4.22"
nom = "8.0.0"
nom-language = "0.1.0"
ordered-float = { version = "4.4.0", features = ["serde"] }
pathbuf = "1.0.0"
paste = "1.0"

pyo3 = { version = "0.22", optional = true, features = ["extension-module"] }
regex = "1.11.0"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
serde_path_to_error = "0.1"
serde-this-or-that = "0.5.0"
serde-value = "0.7.0"
serde_with = "3.9.0"
strum = { version = "0.26.3", features = ["derive"] }
rust_iso3166 = "0.1.13"
tlsh = "0.1.0"
thiserror = "2.0.3"
uuid = { version = "1.10.0", features = [
    "v4", "v5", "std", "macro-diagnostics", "serde"
] }
url = { version = "2.5.2", features = ["serde"] }

# pyo3 0.22's exception macros check their own `gil-refs` feature inside
# `create_exception!`; since the macro expands in this crate, rustc's
# unexpected_cfgs lint fires here. Declare the value expected.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("gil-refs"))'] }

[dev-dependencies]
test-log = "0.2.16"

