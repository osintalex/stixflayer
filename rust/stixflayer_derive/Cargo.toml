[package]
name = "stixflayer_derive"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "Procedural macros for the stixflayer STIX 2.1 library"
repository = "https://github.com/osintalex/stixflayer"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = "2"

[dev-dependencies]
# Doctests exercise the derive end-to-end: the generated code implements
# `stixflayer::properties::StixProperties` and enum variants need the serde
# tag attribute to be a real attribute.
stixflayer = { path = ".." }
serde = { version = "1", features = ["derive"] }
