[package]
name = "stixflayer-cli"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "Command-line STIX 2.1 validator built on the stixflayer engine"
repository = "https://github.com/osintalex/stixflayer"
readme = "../../README.md"

[[bin]]
name = "stixflayer"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
stixflayer = { workspace = true, default-features = false }

[dev-dependencies]
assert_cmd = "2.2"
jsonschema = "0.26"
tempfile = "3.27"
