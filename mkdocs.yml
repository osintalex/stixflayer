# stixflayer documentation — built with Zensical (pinned in docs/requirements.txt).
#
# Portability rule (design.md D1): stay on the config subset that both Zensical
# and Material for MkDocs understand — no Zensical-only or Material-only
# settings, no template overrides. This keeps the Material fallback viable.

site_name: stixflayer
site_description: >-
  Fast STIX 2.1 parsing, validation, and serialization — one Rust engine,
  consumed by many languages.
site_url: https://osintalex.github.io/stixflayer/
repo_url: https://github.com/osintalex/stixflayer
repo_name: osintalex/stixflayer

copyright: Copyright &copy; stflayer contributors

# Keep non-page files in docs/ out of the built site.
exclude_docs: |
  requirements.txt

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Guides:
      - "Parsing and validation": guides/parsing.md
      - "Building objects": guides/building.md
      - "Validation modes": guides/validation.md
      - "Error handling": guides/errors.md
      - Vocabularies: guides/vocabularies.md
      - "STIX patterns": guides/patterns.md
  - API reference:
      - Overview: api/overview.md
      - Exceptions: api/exceptions.md
      - Functions: api/functions.md
      - "Domain objects": api/domain-objects.md
      - "Cyber-observables": api/cyber-objects.md
      - Vocabularies: api/vocabularies.md

theme:
  name: material
  language: en
  features:
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - navigation.footer
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    # Auto + toggles, matching the Material default palette scheme.
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to system preference
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

plugins:
  # mike must precede llmstxt so generated files see the versioned URL.
  - mike
  - llmstxt
  - search

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.emoji:
      # Zensical namespace (not Material's) — required for shortcode rendering.
      # Without this, :emoji: and :material-icon: shortcodes render as literal text.
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
