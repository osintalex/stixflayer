[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "stixflayer"
version = "0.1.0"
description = "STIX 2.1 library in Rust, exposed to Python"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[tool.maturin]
manifest-path = "rust/Cargo.toml"
module-name = "stixflayer"
bindings = "pyo3"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Curated aggressive set (see openspec change "pre-publication-cleanup", design D1).
# Notable omissions vs `ALL`: opinionated families that fight this codebase
# (copyright notices, bandit-style security rules on a parsing library, etc.).
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "UP",      # pyupgrade
    "B",       # flake8-bugbear
    "C4",      # flake8-comprehensions
    "SIM",     # flake8-simplify
    "RUF",     # ruff-specific
    "PL",      # pylint
    "ANN",     # flake8-annotations
    "D",       # pydocstyle
    "PTH",     # flake8-use-pathlib
    "PERF",    # perflint
    "RET",     # flake8-return
    "FLY",     # flake8-flynt
]

[tool.ruff.lint.isort]
# Keep `import X as X` re-exports in a single combined block.
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# Tests and benchmarks keep a pragmatic style: no required annotations or
# docstrings, bare asserts, magic numbers in expected values.
"tests/**" = ["ANN", "D", "PLR2004", "INP001", "RUF043", "PT006"]
"benchmarks/**" = ["ANN", "D", "PLR2004", "INP001", "RUF043", "PT006"]
# The compiled module's stub intentionally models pyo3's dynamic access
# (**kwargs, __getattr__), which is typed as Any.
"src/stixflayer/*.pyi" = ["ANN401"]

[tool.pyrefly]
python-version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests", "benchmarks"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[dependency-groups]
dev = [
    "maturin>=1.15.0",
    "pyrefly>=0.60.2",
    "pytest>=9.0.3",
    "pytest-benchmark>=5.0",
    "ruff>=0.15.10",
    "stix2==3.0.2",
    "stix2-validator",
]
